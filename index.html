<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Golf de Hoy — Familia Montiel</title><style>
:root{--g:#0b6b45;--d:#083d2c;--l:#dfff6a;--c:#f5f4ec;--i:#17342a;--m:#718079}*{box-sizing:border-box}body{margin:0;background:var(--c);color:var(--i);font-family:Arial,sans-serif}button{font:inherit;cursor:pointer}main{max-width:720px;margin:auto;padding:22px 18px 50px}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.eye{font-size:11px;letter-spacing:.16em;font-weight:800;color:var(--g)}h1{font-size:31px;letter-spacing:-.04em;margin:5px 0}.reset{border:0;background:#fff;border-radius:50%;width:43px;height:43px;font-size:23px}.leader{background:var(--d);color:#fff;border-radius:25px;padding:20px;box-shadow:0 14px 35px #083d2c2b}.lt{display:flex;justify-content:space-between;font-size:11px;letter-spacing:.13em;font-weight:800}.lt small{background:var(--l);color:var(--d);padding:4px 7px;border-radius:7px}.rank{display:grid;grid-template-columns:25px 36px 1fr 50px;gap:9px;align-items:center;border-top:1px solid #ffffff20;padding:10px 0}.rank i,.player i{font-style:normal;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:900}.rank div,.name{display:flex;flex-direction:column}.rank small{color:#b9cfc6;font-size:11px}.rs{text-align:right}.rs b{font-size:21px}.winner{background:var(--l);color:var(--d);margin-top:12px;padding:13px;border-radius:13px;font-weight:900;text-align:center}nav{display:grid;grid-template-columns:1fr 1fr;background:#e7e7df;border-radius:14px;padding:4px;margin:18px 0}nav button{border:0;background:transparent;padding:11px;border-radius:11px;color:#68756f;font-weight:800}nav .on{background:#fff;color:var(--d)}.hh{display:grid;grid-template-columns:50px 1fr 50px;align-items:center;text-align:center}.hh button{border:1px solid #ddd;background:#fff;border-radius:50%;width:45px;height:45px;font-size:29px;color:var(--g)}.hh button:disabled{opacity:.25}.hh div{display:flex;flex-direction:column;align-items:center}.hh small{letter-spacing:.18em;font-weight:900;color:var(--g)}.hh b{font-size:52px;line-height:1}.hh span{font-size:11px;font-weight:900;background:#dfe7e0;border-radius:8px;padding:4px 9px}.list{display:flex;flex-direction:column;gap:9px;margin-top:14px}.player{display:flex;align-items:center;background:#fff;border-radius:18px;padding:13px}.player i{width:42px;height:42px}.name{margin-left:11px;flex:1}.name small{color:var(--m);font-size:12px}.counter{display:flex;align-items:center;gap:7px}.counter button{border:0;background:#edf0ea;color:var(--d);border-radius:50%;width:39px;height:39px;font-size:24px;font-weight:800}.counter .num{background:var(--d);color:#fff;width:44px;height:44px;font-size:21px}.next{width:100%;border:0;border-radius:16px;background:var(--g);color:#fff;font-weight:900;padding:16px;margin-top:14px}.next:disabled{background:#a9b4ae}.hint,footer{text-align:center;color:var(--m);font-size:12px}.card{background:#fff;border-radius:20px;padding:12px}.wrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:center;font-size:13px}th,td{padding:10px 7px;border-bottom:1px solid #e8ebe6}.total{font-weight:900;background:#f1f4ee}.net{font-weight:900;background:var(--l)}.toast{position:fixed;top:15px;left:50%;transform:translateX(-50%);z-index:9;background:#172d25;color:#fff;padding:12px 20px;border-radius:99px;font-weight:800;white-space:nowrap}footer{margin-top:25px}@media(min-width:650px){.list{display:grid;grid-template-columns:1fr 1fr}}
</style></head><body><main><header><div><span class="eye">PARTIDA DE HOY · 18 HOYOS</span><h1>Golf en familia ⛳</h1></div><button class="reset" onclick="resetGame()">↻</button></header><section class="leader"><div class="lt"><span>CLASIFICACIÓN EN VIVO</span><small>NETO</small></div><div id="ranking"></div><div id="winner"></div></section><nav><button id="playBtn" class="on" onclick="showTab('play')">Anotar hoyo</button><button id="cardBtn" onclick="showTab('card')">Tarjeta completa</button></nav><div id="content"></div><footer>Hecho para la partida de hoy · Ventajas aplicadas al resultado neto.</footer></main><script>
const P=[['Talia','Rojas',5,'#ff6b7a'],['Daniel','Rojas',15,'#58b8ff'],['David','Negras',0,'#1f2937'],['Pablo','Rojas',12,'#ffc247']],KEY='golf-familia-2026-08-16';let scores=JSON.parse(localStorage.getItem(KEY)||'null')||Array.from({length:18},()=>Array(4).fill(null)),hole=0,tab='play';
function stats(){return P.map((p,i)=>{let played=scores.filter(r=>r[i]!=null).length,gross=scores.reduce((a,r)=>a+(r[i]||0),0);return{p,i,played,gross,net:gross-Math.min(p[2],played)}}).sort((a,b)=>b.played-a.played||a.net-b.net)}
function render(){let rank=stats();ranking.innerHTML=rank.map((x,n)=>`<div class="rank"><b style="opacity:.6">${n+1}</b><i style="background:${x.p[3]}">${x.p[0][0]}</i><div><strong>${x.p[0]}</strong><small>${x.p[1]} · ${x.p[2]?x.p[2]+' de ventaja':'Sin ventaja'}</small></div><div class="rs"><b>${x.played?x.net:'—'}</b><small>${x.played}/18</small></div></div>`).join('');winner.innerHTML=scores.every(r=>r.every(s=>s!=null))?`<div class="winner">🏆 ¡${rank[0].p[0]} ganó con ${rank[0].net} golpes netos!</div>`:'';playBtn.className=tab==='play'?'on':'';cardBtn.className=tab==='card'?'on':'';content.innerHTML=tab==='play'?play():card();localStorage.setItem(KEY,JSON.stringify(scores))}
function play(){let complete=scores[hole].every(s=>s!=null);return `<section class="hh"><button ${hole===0?'disabled':''} onclick="go(-1)">‹</button><div><small>HOYO</small><b>${hole+1}</b><span>PAR 3</span></div><button ${hole===17?'disabled':''} onclick="go(1)">›</button></section><section class="list">${P.map((p,i)=>{let s=scores[hole][i],label=s==null?'Sin anotar':s===1?'¡Hoyo en uno!':s===2?'Birdie':s===3?'Par':s===4?'Bogey':'+'+(s-3);return `<article class="player"><i style="background:${p[3]}">${p[0][0]}</i><div class="name"><b>${p[0]}</b><small>${label}</small></div><div class="counter"><button onclick="change(${i},-1)" ${s==null?'disabled':''}>−</button><button class="num" onclick="start(${i})">${s==null?'·':s}</button><button onclick="change(${i},1)">+</button></div></article>`}).join('')}</section><button class="next" ${complete?'':'disabled'} onclick="next()">${hole===17?'Ver resultado final':complete?'Guardar y seguir al hoyo '+(hole+2):'Anota los 4 resultados'}</button><p class="hint">Toca el punto para empezar en par (3). Todo se guarda automáticamente.</p>`}
function card(){return `<section class="card"><div class="wrap"><table><thead><tr><th>Hoyo</th><th>Par</th>${P.map(p=>'<th>'+p[0]+'</th>').join('')}</tr></thead><tbody>${scores.map((r,h)=>`<tr onclick="openHole(${h})"><td>${h+1}</td><td>3</td>${r.map(s=>'<td>'+(s==null?'—':s)+'</td>').join('')}</tr>`).join('')}<tr class="total"><td>TOTAL</td><td>54</td>${P.map((p,i)=>'<td>'+(scores.reduce((a,r)=>a+(r[i]||0),0)||'—')+'</td>').join('')}</tr><tr class="net"><td>NETO</td><td>—</td>${stats().sort((a,b)=>a.i-b.i).map(x=>'<td>'+(x.played?x.net:'—')+'</td>').join('')}</tr></tbody></table></div><p class="hint">Toca cualquier fila para corregir ese hoyo.</p></section>`}
function change(i,d){scores[hole][i]=Math.max(1,(scores[hole][i]??3)+d);render()}function start(i){if(scores[hole][i]==null)scores[hole][i]=3;render()}function go(d){hole=Math.max(0,Math.min(17,hole+d));render()}function next(){if(hole<17)hole++;else tab='card';render()}function showTab(t){tab=t;render()}function openHole(h){hole=h;tab='play';render()}function resetGame(){if(confirm('¿Borrar todos los resultados de hoy?')){scores=Array.from({length:18},()=>Array(4).fill(null));hole=0;tab='play';render()}}
setInterval(()=>{if(scores[hole].some(s=>s==null)){let t=document.createElement('div');t.className='toast';t.textContent='⛳ Falta apuntar el hoyo '+(hole+1);document.body.appendChild(t);setTimeout(()=>t.remove(),5000)}},90000);render();
</script></body></html>
